<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1a14">
<title>Robot Explainer</title>
<style>
  :root { --bg: #f6f7f4; --fg: #17201a; --muted: #5d6a61; --card: #fff; --line: #d9ded8; --accent: #2f7d4f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1a14; --fg: #e6ece7; --muted: #9aa89e; --card: #18251d; --line: #2a3a30; --accent: #5cc58a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 -apple-system, system-ui, sans-serif;
         padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 16px); }
  h1 { font-size: 1.25rem; margin: 16px 0 8px; }
  .row { display: flex; gap: 8px; }
  select, textarea, button { font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line);
                             border-radius: 10px; padding: 10px; width: 100%; }
  button { background: var(--accent); color: #fff; border: 0; font-weight: 600; }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
  button:disabled { opacity: .5; }
  #log { margin: 16px 0; display: flex; flex-direction: column; gap: 12px; }
  .q { font-weight: 600; }
  .a { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px 14px; overflow-wrap: anywhere; }
  .a.err, .a.plain { white-space: pre-wrap; padding: 12px; }
  .a h1, .a h2, .a h3 { font-size: 1.05rem; margin: 14px 0 6px; } .a h1 { font-size: 1.15rem; }
  .a p, .a ul, .a ol { margin: 8px 0; } .a ul, .a ol { padding-left: 22px; } .a li { margin: 2px 0; }
  .a table { border-collapse: collapse; width: 100%; font-size: .9rem; margin: 8px 0; display: block; overflow-x: auto; }
  .a th, .a td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; } .a th { background: var(--bg); }
  .a code { background: var(--bg); border-radius: 4px; padding: 1px 4px; font-size: .9em; }
  .a pre { background: var(--bg); border-radius: 8px; padding: 10px; overflow-x: auto; } .a pre code { padding: 0; }
  .a blockquote { margin: 8px 0; padding: 4px 12px; border-left: 3px solid var(--line); color: var(--muted); }
  .a hr { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }
  .a input[type=checkbox] { margin-right: 6px; }
  .callout { margin: 8px 0; padding: 8px 12px; border-radius: 8px; border-left: 4px solid var(--c); background: color-mix(in srgb, var(--c) 12%, transparent); color: var(--fg); }
  .callout > .title { font-weight: 600; margin-bottom: 2px; }
  .callout.note { --c: #3b82f6; } .callout.tip { --c: #2f9e5b; } .callout.important { --c: #8b5cf6; }
  .callout.warning { --c: #d97706; } .callout.caution { --c: #dc2626; }
  .cite { display: inline-block; font-size: .72rem; line-height: 1.4; padding: 0 6px; border-radius: 999px; background: var(--bg);
          border: 1px solid var(--line); color: var(--muted); vertical-align: 1px; }
  .err { color: #c0392b; }
  small { color: var(--muted); }
  .steps { color: var(--muted); font-size: .85rem; white-space: pre-line; }
  .docs { margin: 8px 0 0; padding-left: 20px; color: var(--muted); font-size: .85rem; overflow-wrap: anywhere; }
  .proposal { border: 1px dashed var(--accent); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
</style>
</head>
<body>
<h1>Robot Explainer</h1>
<div class="row">
  <select id="scenario" aria-label="Scenario"></select>
  <select id="provider" aria-label="Model"></select>
</div>
<div id="log"></div>
<textarea id="q" rows="3" aria-label="Question, or fact to save" placeholder="Why did you avoid path A?"></textarea>
<div class="row" style="margin-top:8px">
  <button id="ask">Ask</button>
  <button id="fact" class="ghost">Save as fact</button>
</div>
<p><small id="status"></small></p>
<button id="add-doc" class="ghost">Add document</button>
<input type="file" id="doc-file" hidden>
<p><small id="doc-status" role="status"></small></p>
<ul id="docs" class="docs"></ul>
<script src="/vendor/marked.min.js"></script>
<script src="/vendor/purify.min.js"></script>
<script>
  if (location.hash.length > 1) {
    try { localStorage.setItem("token", location.hash.slice(1)); } catch {}
    history.replaceState(null, "", location.pathname);
  }
  let token = ""; try { token = localStorage.getItem("token") || ""; } catch {}
  const $ = id => document.getElementById(id), turns = [];
  const headers = { "Authorization": "Bearer " + token, "Content-Type": "application/json" };
  const scenario = () => $("scenario").value === "" ? null : Number($("scenario").value);

  fetch("/api/info", { headers }).then(r => r.ok ? r.json() : Promise.reject(r.status)).then(info => {
    $("scenario").add(new Option("No current scenario", ""));
    info.scenarios.forEach((d, i) => $("scenario").add(new Option(`${i}: ${d}`, i)));
    info.providers.forEach(p => $("provider").add(new Option(p, p)));
    $("doc-file").accept = info.document_types.join(",");
    loadDocuments();
  }).catch(e => $("status").textContent = e === 401 ? "Open the link printed by `hci serve`." : "Server unreachable.");

  $("ask").onclick = async () => {
    const question = $("q").value.trim(); if (!question) return;
    $("ask").disabled = true; $("q").value = "";
    const a = document.createElement("div"); a.className = "a";
    const q = document.createElement("div"); q.className = "q"; q.textContent = question;
    const steps = document.createElement("div"); steps.className = "steps";
    $("log").append(q, steps, a);
    try {
      const r = await fetch("/api/ask", { method: "POST", headers, body: JSON.stringify(
        { question, scenario: scenario(), provider: $("provider").value, history: turns.slice(-3) }) });
      if (!r.ok) throw new Error(await r.text());
      const reader = r.body.getReader(), dec = new TextDecoder();
      let raw = "", text = "";
      // stream markers: \x1f starts a step line, \x1e starts the proposals JSON (single definition: hci/constants.py)
      for (let c; !(c = await reader.read()).done;) {
        raw += dec.decode(c.value, { stream: true });
        const [body] = raw.split("\x1e"), done = [...body.matchAll(/\x1f([^\n]*)\n/g)].map(m => m[1]);
        steps.textContent = done.length ? "· " + done.join("\n· ") : "";
        text = body.replace(/\x1f[^\n]*(\n|$)/g, ""); renderMarkdown(a, text); a.scrollIntoView({ block: "end" });
      }
      turns.push([question, text]);
      if (raw.includes("\x1e")) JSON.parse(raw.split("\x1e")[1]).forEach(showProposal);
    } catch (e) { a.classList.add("err"); a.textContent = String(e.message || e); }
    $("ask").disabled = false;
  };

  // Markdown + Notion-like extras: > [!NOTE|TIP|IMPORTANT|WARNING|CAUTION] callouts and [1] / [1.2] citation badges.
  // Model output is untrusted: always sanitized by DOMPurify before it reaches the page.
  const CITE = String.raw`\d+(?:\.\d+)?(?:[–-]\d+(?:\.\d+)?)?`;  // 2, 1.2, 1.1–1.3
  const CITATION = new RegExp(String.raw`(\[${CITE}(?:,\s*${CITE})*\])`);  // [2], [1.5, 1.9]
  const CALLOUTS = { NOTE: "Note", TIP: "Tip", IMPORTANT: "Important", WARNING: "Warning", CAUTION: "Caution" };

  function renderMarkdown(el, text) {
    if (!window.marked || !window.DOMPurify) { el.classList.add("plain"); el.textContent = text; return; }
    el.innerHTML = DOMPurify.sanitize(marked.parse(text, { gfm: true, breaks: true }));
    el.querySelectorAll("blockquote").forEach(toCallout);
    citeBadges(el);
  }

  function toCallout(quote) {
    const first = quote.querySelector("p"), m = first && first.textContent.match(/^\s*\[!(\w+)\]\s*/);
    if (!m || !CALLOUTS[m[1].toUpperCase()]) return;
    const kind = m[1].toUpperCase(), box = document.createElement("div"), title = document.createElement("div");
    box.className = "callout " + kind.toLowerCase(); title.className = "title"; title.textContent = CALLOUTS[kind];
    first.firstChild.textContent = first.firstChild.textContent.replace(/^\s*\[!\w+\]\s*/, "");
    box.append(title, ...quote.childNodes); quote.replaceWith(box);
  }

  function citeBadges(el) {
    const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), nodes = [];
    while (walker.nextNode()) if (!walker.currentNode.parentElement.closest("code, pre")) nodes.push(walker.currentNode);
    for (const node of nodes) {
      const parts = node.textContent.split(CITATION);
      if (parts.length === 1) continue;
      node.replaceWith(...parts.map((part, i) => {
        if (i % 2 === 0) return part;
        const badge = document.createElement("span"); badge.className = "cite"; badge.textContent = part.slice(1, -1);
        return badge;
      }));
    }
  }

  function showProposal(p) {
    const box = document.createElement("div"); box.className = "proposal";
    const label = document.createElement("div");
    label.textContent = `Save this fact${p.scenario === null ? "" : " for scenario " + p.scenario}? ${p.text}`;
    const row = document.createElement("div"); row.className = "row";
    const yes = document.createElement("button"); yes.textContent = "Approve";
    const no = document.createElement("button"); no.textContent = "Reject"; no.className = "ghost";
    const msg = document.createElement("small");
    yes.onclick = async () => {
      yes.disabled = no.disabled = true;
      try { await saveFact(p); box.replaceChildren("Fact saved."); }
      catch (e) { msg.textContent = String(e.message || e); yes.disabled = no.disabled = false; }
    };
    no.onclick = () => { yes.disabled = no.disabled = true; box.remove(); };
    row.append(yes, no); box.append(label, row, msg); $("log").append(box);
  }

  async function saveFact(fact) {
    let r;
    try { r = await fetch("/api/facts", { method: "POST", headers, body: JSON.stringify(fact) }); }
    catch { throw new Error("Could not save fact: server unreachable."); }
    if (!r.ok) throw new Error(`Could not save fact (HTTP ${r.status}).`);
  }

  // Documents: XMLHttpRequest rather than fetch, for upload progress. Server text only goes through textContent.
  function docStatus(text, error = false) { $("doc-status").textContent = text; $("doc-status").classList.toggle("err", error); }

  async function loadDocuments() {
    const r = await fetch("/api/documents", { headers }).catch(() => null);
    if (!r) return docStatus("Could not list documents: server unreachable.", true);
    if (!r.ok) return docStatus(r.status === 401 ? "Could not list documents: open the link printed by `hci serve`."
                                                 : `Could not list documents (HTTP ${r.status}).`, true);
    $("docs").replaceChildren(...(await r.json()).map(d => {
      const li = document.createElement("li");
      li.textContent = `${d.name}: ${d.chunks ? d.chunks + " passages" : "not readable"}`;
      return li;
    }));
  }

  function uploadDocument(file) {
    const xhr = new XMLHttpRequest(), form = new FormData();
    form.append("file", file);
    xhr.open("POST", "/api/documents");
    xhr.setRequestHeader("Authorization", headers.Authorization);
    xhr.upload.onprogress = e => { if (e.lengthComputable) docStatus(`Uploading ${file.name}: ${Math.round(100 * e.loaded / e.total)} %`); };
    xhr.onload = () => {
      let body = {}; try { body = JSON.parse(xhr.responseText); } catch {}
      if (xhr.status === 200) { docStatus(`Added ${body.name}: ${body.chunks} passages indexed.`); loadDocuments(); return; }
      docStatus(`Upload failed: ${typeof body.detail === "string" ? body.detail : "HTTP " + xhr.status}`, true);
    };
    xhr.onerror = () => docStatus("Upload failed: server unreachable.", true);
    xhr.onloadend = () => { $("add-doc").disabled = false; };
    $("add-doc").disabled = true; docStatus(`Uploading ${file.name}…`);
    xhr.send(form);
  }

  $("add-doc").onclick = () => $("doc-file").click();
  $("doc-file").onchange = () => { const file = $("doc-file").files[0]; if (file) uploadDocument(file); $("doc-file").value = ""; };

  $("fact").onclick = async () => {
    const text = $("q").value.trim(); if (!text) return;
    try { await saveFact({ text, scenario: scenario() }); $("status").textContent = "Fact saved."; $("q").value = ""; }
    catch (e) { $("status").textContent = String(e.message || e); }
  };
</script>
</body>
</html>
