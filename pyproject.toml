[project]
name = "hci"
version = "2.0.0"
description = "RAG that explains a robot's navigation choices from its past paths"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy",
    "torch",
    "transformers",
    "sentence-transformers>=5",
    "anthropic",
    "httpx",
    "fastapi",
    "uvicorn",
    "mlx-lm; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "prompt-toolkit>=3.0.53",
]

[project.scripts]
hci = "hci.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "jsonschema",
    "ty>=0.0.91",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
