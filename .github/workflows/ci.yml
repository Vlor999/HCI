name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # tests use a fake embedder and generator: no torch or model download needed
      - run: uvx ruff check hci tests
      - run: uv run --no-project -p 3.12 --with numpy --with httpx --with pytest pytest -q
        env:
          PYTHONPATH: .
