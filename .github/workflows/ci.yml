name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.5"
          enable-cache: true
      # test_cases.py runs the real embedder (BAAI/bge-small-en-v1.5): downloaded on the first run, then cached
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: hf-bge-small-en-v1.5
      # Linux resolves CPU-only torch from the pytorch-cpu index (see [tool.uv.sources] in pyproject.toml)
      - run: uv sync --locked
      - run: make check-all
