name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff check hci tests
      # no LLM needed; the JSON cases use the real embedder on CPU torch
      - run: >
          uv run --no-project -p 3.12 --index https://download.pytorch.org/whl/cpu --index-strategy unsafe-best-match
          --with torch --with sentence-transformers --with httpx --with anthropic --with jsonschema --with pytest pytest -q
        env:
          PYTHONPATH: .
